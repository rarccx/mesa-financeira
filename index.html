<!DOCTYPE html>
<html lang="pt-BR" data-mod="pf">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mesa Financeira</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<style>
:root{--bg:#F2F4F1;--sf:#fff;--ink:#17201C;--mu:#5C6963;--ln:#DCE2DD;--ac:#1D6B58;--on:#fff;--in:#1B7A4B;--out:#B03A2E;--wn:#92600A;--c1:#3E5C76;--c2:#D9A441;--c3:#B5546B;--c4:#5B9A7F;--c5:#CBD3CE;--ff:'Schibsted Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif}
[data-mod=pj]{--ac:#2A4494}
@media(prefers-color-scheme:dark){:root{--bg:#101512;--sf:#18201C;--ink:#E8EEEA;--mu:#9BA9A2;--ln:#2B3630;--ac:#58C2A2;--on:#0B1511;--in:#5CCB92;--out:#F2938A;--wn:#E9B15A;--c5:#38443E}[data-mod=pj]{--ac:#8FA8F0}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ff);padding:20px 16px 48px}
.w{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font:700 22px/1.2 var(--ff);margin:0;letter-spacing:-.01em}
h2{font:700 16px/1.3 var(--ff);margin:0 0 12px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--sf);border-radius:8px;padding:10px 14px;min-height:42px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);border-color:var(--ac);color:var(--on);font-weight:700}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:4px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-top:12px}
.sw button{border:0;background:transparent;font-weight:500;border-radius:9px;min-height:46px}
.sw button[aria-pressed=true]{background:var(--ac);color:var(--on);font-weight:700}
.nv{display:flex;gap:22px;border-bottom:1px solid var(--ln)}
.nv button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:10px 2px;color:var(--mu)}
.nv button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ac);font-weight:700}
.tb{display:flex;align-items:center;justify-content:space-between}
.tb b{font-size:17px}
.tb button{width:42px;padding:0;font-size:20px}
.pn{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:18px}
.cap{font-size:13px;color:var(--mu)}
.big{font:700 clamp(34px,9vw,46px)/1.1 var(--ff);font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin:4px 0}
.pos{color:var(--in)}.neg{color:var(--out)}
.ts{display:grid;grid-template-columns:1fr;padding:6px 14px}
.ts>div{padding:12px 4px}
.ts>div+div{border-top:1px solid var(--ln)}
.ts b{display:block;font-size:22px;line-height:1.3;font-variant-numeric:tabular-nums}
@media(min-width:600px){.ts{grid-template-columns:repeat(3,1fr);padding:14px 0}.ts>div{padding:4px 18px}.ts>div+div{border-top:0;border-left:1px solid var(--ln)}}
.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;margin:6px 0}
.bar i{display:block;min-width:0}
.bar.ref{height:10px;opacity:.85}
.lg{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.lg li{display:grid;grid-template-columns:14px 1fr auto 44px;gap:8px;align-items:center;font-size:14px}
.lg .s{width:12px;height:12px;border-radius:3px}
.lg b,.lg em{font-variant-numeric:tabular-nums;font-style:normal}
.lg em{color:var(--mu);text-align:right}
.ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.ins li{border-left:4px solid var(--k,var(--mu));padding-left:12px}
.ins .bad{--k:var(--out)}.ins .warn{--k:var(--wn)}.ins .ok{--k:var(--in)}
.cats{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.cats li{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:14px}
.cats li::after{content:"";grid-column:1/-1;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--ac) var(--w),var(--c5) var(--w))}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mu)}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;min-height:44px;width:100%}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g .full{grid-column:1/-1}
.ac{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.em p{color:var(--mu);max-width:56ch}
.ls{list-style:none;margin:0;padding:0}
.ls li{display:grid;grid-template-columns:1fr auto auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.ls li:first-child{border-top:0}
.ls small{display:block;color:var(--mu)}
.ls .v{font-weight:700;font-variant-numeric:tabular-nums}
.gh{border:0;background:none;color:var(--mu);min-height:36px;padding:6px 8px}
.ft{font-size:13px;color:var(--mu);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
svg.ch{width:100%;height:auto;display:block}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
  <header>
    <h1>Mesa Financeira</h1>
    <div class="sw" role="group" aria-label="Módulo">
      <button data-m="pf" aria-pressed="true">Pessoa física</button>
      <button data-m="pj" aria-pressed="false">Pessoa jurídica</button>
    </div>
  </header>
  <nav class="nv" aria-label="Seções">
    <button data-v="p" aria-pressed="true">Painel</button>
    <button data-v="l" aria-pressed="false">Lançamentos</button>
  </nav>
  <main id="app" class="w"></main>
  <footer class="ft">
    <span>Controle gerencial, não substitui a contabilidade. Os dados ficam salvos neste navegador.</span>
    <button data-a="clr">Apagar dados</button>
  </footer>
</div>

<script>
const $=s=>document.querySelector(s);
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=c=>(c<0?'−':'')+(Math.abs(c)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pc=x=>Math.round(x*100)+'%';
const p2=n=>String(n).padStart(2,'0');
const ym=d=>d.getFullYear()+'-'+p2(d.getMonth()+1);
const sh=(m,n)=>ym(new Date(+m.slice(0,4),+m.slice(5)-1+n,1));
const MN=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const ml=m=>MN[+m.slice(5)-1]+' de '+m.slice(0,4);
const mab=m=>MN[+m.slice(5)-1].slice(0,3);
const today=()=>{const d=new Date();return ym(d)+'-'+p2(d.getDate())};
const val=s=>{s=String(s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?Math.round(n*100):0};
const dl=(a,b)=>b?(a>=b?'+':'−')+pc(Math.abs(a-b)/b)+' vs. mês anterior':'Sem mês anterior para comparar';
const uid=()=>Math.random().toString(36).slice(2);

/* ---------- categorias: [id, nome, grupo] ---------- */
const CFG={
 pf:{nome:'pessoa física',cx:'Reserva de emergência',
  g:{ren:'Renda',nec:'Necessidades',des:'Desejos',fut:'Futuro'},
  c:[['sal','Salário','ren'],['ext','Renda extra','ren'],['rend','Rendimentos','ren'],
     ['mor','Moradia','nec'],['mer','Mercado','nec'],['tra','Transporte','nec'],['sau','Saúde','nec'],['edu','Educação','nec'],['con','Contas e dívidas','nec'],
     ['laz','Lazer','des'],['res','Restaurantes e delivery','des'],['cpr','Compras','des'],['ass','Assinaturas','des'],
     ['inv','Investimentos e reserva','fut']]},
 pj:{nome:'pessoa jurídica',cx:'Caixa da empresa',
  g:{rec:'Receitas',ded:'Impostos sobre vendas',cus:'Custos',des:'Despesas',ret:'Retiradas dos sócios'},
  c:[['ven','Vendas','rec'],['ser','Serviços','rec'],['orec','Outras receitas','rec'],
     ['imp','Impostos (DAS, ICMS)','ded'],
     ['cmv','Mercadorias e insumos','cus'],['fre','Fretes e embalagens','cus'],
     ['fol','Folha e encargos','des'],['alu','Aluguel','des'],['mkt','Marketing','des'],['sis','Sistemas e assinaturas','des'],['ter','Contabilidade e terceiros','des'],['out','Outras despesas','des'],
     ['pro','Pró-labore e retirada de lucro','ret']]}
};
const isIn=g=>g==='ren'||g==='rec';
const cat=(m,id)=>CFG[m].c.find(x=>x[0]===id)||[id,'Outros','des'];

/* ---------- estado ---------- */
const K='mesa-financeira-v2';
let S={m:'pf',v:'p',mes:ym(new Date()),pf:{l:[],cx:0},pj:{l:[],cx:0}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
S.mes=ym(new Date());
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};

function agg(m,mes){
  const o={bc:{}};Object.keys(CFG[m].g).forEach(g=>o[g]=0);
  S[m].l.forEach(l=>{if(!l.d.startsWith(mes))return;o[cat(m,l.c)[2]]+=l.v;o.bc[l.c]=(o.bc[l.c]||0)+l.v});
  return o;
}
const tOut=(m,a)=>Object.keys(CFG[m].g).reduce((s,g)=>s+(isIn(g)?0:a[g]),0);
const tIn=(m,a)=>Object.keys(CFG[m].g).reduce((s,g)=>s+(isIn(g)?a[g]:0),0);

/* ---------- recomendações ---------- */
function insights(m,a,p,cx){
  const I=[],push=(k,t)=>I.push([k,t]);
  if(m==='pf'){
    const r=a.ren,gs=a.nec+a.des;
    if(!r)return[['info','Registre sua renda do mês para calcular quanto você consegue guardar.']];
    const g=r-gs,t=g/r;
    if(g<0)push('bad',`Você gastou ${brl(-g)} a mais do que ganhou. Comece pelos desejos (${brl(a.des)}): é onde o corte dói menos.`);
    else if(t<.1)push('warn',`Você guardou só ${pc(t)} da renda. A referência é 20%, ou seja, ${brl(r*.2)} por mês.`);
    else if(t>=.2)push('ok',`Você guardou ${pc(t)} da renda, acima da referência de 20%. Direcione esse valor para a reserva e para investimentos.`);
    else push('info',`Você guardou ${pc(t)} da renda. Faltam ${brl(r*.2-g)} para a referência de 20%.`);
    if(a.nec/r>.5)push('warn',`Necessidades consomem ${pc(a.nec/r)} da renda (referência: 50%). Revise moradia, contas fixas e dívidas antes de cortar o resto.`);
    if(a.des/r>.3)push('warn',`Desejos consomem ${pc(a.des/r)} da renda (referência: 30%). Chegar a 30% libera ${brl(a.des-r*.3)} por mês.`);
    if(gs>0){
      const n=cx/gs,ns=n.toFixed(1).replace('.',',');
      if(!cx)push('info','Informe o saldo da sua reserva abaixo para ver quantos meses de gastos ela cobre.');
      else if(n<3)push('bad',`Sua reserva cobre ${ns} meses de gastos. O mínimo é 3 meses; faltam ${brl(gs*3-cx)}.`);
      else if(n<6)push('warn',`Sua reserva cobre ${ns} meses de gastos. Para chegar a 6 meses, faltam ${brl(gs*6-cx)}.`);
      else push('ok',`Sua reserva cobre ${ns} meses de gastos. Novos aportes podem ir para investimentos de prazo maior.`);
    }
  }else{
    const rec=a.rec;
    if(!rec)return[['info','Registre as receitas do mês para calcular margem, ponto de equilíbrio e caixa.']];
    const res=rec-a.ded-a.cus-a.des,mg=res/rec,mc=(rec-a.ded-a.cus)/rec;
    if(res<0)push('bad',`A empresa fechou o mês com prejuízo de ${brl(-res)}. Revise primeiro os custos (${pc(a.cus/rec)} da receita) e as despesas (${pc(a.des/rec)}).`);
    else if(mg<.1)push('warn',`Margem de ${pc(mg)}: o resultado é apertado e uma queda pequena nas vendas pode virar prejuízo.`);
    else push('ok',`Margem de ${pc(mg)}. ${mg>=.2?'Acima de 20%, há folga para reinvestir ou reforçar o caixa.':'Saudável, mas ainda há espaço para melhorar custos e preços.'}`);
    if(mc>0&&a.des>0){
      const pe=a.des/mc;
      if(rec<pe)push('bad',`Ponto de equilíbrio: ${brl(pe)} em vendas por mês. Você vendeu ${brl(rec)} e faltaram ${brl(pe-rec)}.`);
      else push('ok',`Ponto de equilíbrio: ${brl(pe)} em vendas por mês. Você vendeu ${pc(rec/pe-1)} acima dele.`);
    }
    if(a.ded/rec>.15)push('warn',`Impostos sobre vendas pesam ${pc(a.ded/rec)} da receita. Vale conversar com o contador sobre o regime tributário.`);
    if(a.ret>0){
      if(a.ret>Math.max(res,0))push('warn',`As retiradas (${brl(a.ret)}) superaram o resultado (${brl(Math.max(res,0))}): a empresa está sendo descapitalizada.`);
      else push('ok',`As retiradas dos sócios (${brl(a.ret)}) cabem no resultado do mês.`);
    }
    const op=a.ded+a.cus+a.des;
    if(op>0){
      const d=Math.round(cx/(op/30));
      if(!cx)push('info','Informe o saldo do caixa abaixo para ver por quantos dias a empresa se sustenta.');
      else if(d<30)push('bad',`O caixa cobre ${d} dias de operação. Abaixo de 30 dias, um atraso de cliente já causa aperto.`);
      else if(d<90)push('warn',`O caixa cobre ${d} dias de operação. O ideal é ter pelo menos 90.`);
      else push('ok',`O caixa cobre ${d} dias de operação, uma margem confortável.`);
    }
    if(p.rec>0&&Math.abs(rec/p.rec-1)>=.05)push('info',`A receita ${rec>=p.rec?'subiu':'caiu'} ${pc(Math.abs(rec/p.rec-1))} em relação ao mês anterior.`);
  }
  const ta=tOut(m,a),tp=tOut(m,p);
  if(tp>0&&ta>tp*1.1){
    let best=null,bd=0;
    Object.keys(a.bc).forEach(c=>{if(isIn(cat(m,c)[2]))return;const d=a.bc[c]-(p.bc[c]||0);if(d>bd){bd=d;best=c}});
    if(best)push('warn',`As saídas subiram ${pc(ta/tp-1)} em relação ao mês anterior. A maior alta foi em ${cat(m,best)[1]} (+${brl(bd)}).`);
  }
  const R={bad:0,warn:1,info:2,ok:3};
  return I.sort((x,y)=>R[x[0]]-R[y[0]]);
}

/* ---------- telas ---------- */
const mon=()=>`<div class="tb"><button data-a="pm" aria-label="Mês anterior">‹</button><b>${ml(S.mes)}</b><button data-a="nm" aria-label="Próximo mês">›</button></div>`;

function hist(m){
  const ms=[];for(let i=-5;i<=0;i++)ms.push(sh(S.mes,i));
  const d=ms.map(x=>{const a=agg(m,x);return[x,tIn(m,a),tOut(m,a)]});
  const mx=Math.max(1,...d.map(x=>Math.max(x[1],x[2])));
  let h='<svg class="ch" viewBox="0 0 360 140" role="img" aria-label="Entradas e saídas dos últimos 6 meses">';
  d.forEach((x,i)=>{
    const X=i*60+8,he=x[1]/mx*100,hs=x[2]/mx*100;
    h+=`<rect x="${X}" y="${110-he}" width="20" height="${he}" rx="2" fill="var(--in)"/><rect x="${X+23}" y="${110-hs}" width="20" height="${hs}" rx="2" fill="var(--out)"/><text x="${X+22}" y="128" text-anchor="middle" font-size="11" fill="var(--mu)">${mab(x[0])}</text>`;
  });
  return h+'</svg><p class="cap">Em cada mês: entradas à esquerda (verde), saídas à direita (vermelho).</p>';
}

function painel(){
  const m=S.m,pf=m==='pf',C=CFG[m],a=agg(m,S.mes),p=agg(m,sh(S.mes,-1)),cx=S[m].cx;
  if(!S[m].l.some(l=>l.d.startsWith(S.mes)))
    return mon()+`<section class="pn em"><h2>Nenhum lançamento em ${ml(S.mes)}</h2><p>Registre ${pf?'sua renda e seus gastos':'as receitas, os custos e as despesas'} para ver a análise e as recomendações aqui.</p><div class="ac"><button class="pri" data-a="go">Adicionar lançamento</button><button data-a="demo">Carregar dados de exemplo</button></div></section>`;
  let big,sub,seg,t,ref='';
  if(pf){
    const r=a.ren,g=r-a.nec-a.des,gs=a.nec+a.des;
    big=g;sub=r?`${pc(g/r)} da renda · referência: 20%`:'Registre sua renda para ver o percentual';
    seg=[['Necessidades',a.nec,'c1'],['Desejos',a.des,'c2'],['Guardado',Math.max(g,0),'c4']];
    ref='<p class="cap">Referência 50/30/20</p><div class="bar ref"><i style="flex:50;background:var(--c1)"></i><i style="flex:30;background:var(--c2)"></i><i style="flex:20;background:var(--c4)"></i></div>';
    t=[['Renda',brl(r),dl(r,p.ren)],['Gastos',brl(gs),dl(gs,p.nec+p.des)],['Reserva',cx&&gs?(cx/gs).toFixed(1).replace('.',',')+' meses':'—','de gastos cobertos']];
  }else{
    const rec=a.rec,op=a.ded+a.cus+a.des,res=rec-op;
    big=res;sub=rec?`margem de ${pc(res/rec)}`:'Registre as receitas para ver a margem';
    seg=[['Impostos',a.ded,'c3'],['Custos',a.cus,'c1'],['Despesas',a.des,'c2'],['Retiradas',a.ret,'c4'],['Sobra no caixa',Math.max(rec-op-a.ret,0),'c5']];
    t=[['Receita',brl(rec),dl(rec,p.rec)],['Custos e despesas',brl(op),dl(op,p.ded+p.cus+p.des)],['Caixa',cx&&op?Math.round(cx/(op/30))+' dias':'—','de operação cobertos']];
  }
  const den=seg.reduce((s,x)=>s+x[1],0)||1;
  const bar=seg.map(x=>`<i style="flex:${x[1]};background:var(--${x[2]})"></i>`).join('');
  const lg=seg.map(x=>`<li><span class="s" style="background:var(--${x[2]})"></span><span>${x[0]}</span><b>${brl(x[1])}</b><em>${pc(x[1]/den)}</em></li>`).join('');
  const I=insights(m,a,p,cx).map(x=>`<li class="${x[0]}">${x[1]}</li>`).join('');
  const outs=Object.entries(a.bc).filter(x=>!isIn(cat(m,x[0])[2])).sort((x,y)=>y[1]-x[1]).slice(0,6);
  const mx=outs.length?outs[0][1]:1;
  const cats=outs.length?`<ul class="cats">${outs.map(x=>`<li style="--w:${x[1]/mx*100}%"><span>${E(cat(m,x[0])[1])}</span><b>${brl(x[1])}</b></li>`).join('')}</ul>`:'<p class="cap">Nenhuma saída registrada neste mês.</p>';
  return mon()+`
  <section class="pn"><p class="cap">${pf?'Guardado':'Resultado'} em ${MN[+S.mes.slice(5)-1]}</p><p class="big ${big<0?'neg':'pos'}">${brl(big)}</p><p class="cap">${sub}</p></section>
  <section class="pn ts">${t.map(x=>`<div><span class="cap">${x[0]}</span><b>${x[1]}</b><span class="cap">${x[2]}</span></div>`).join('')}</section>
  <section class="pn"><h2>${pf?'Para onde foi sua renda':'Para onde foi a receita'}</h2>${pf?'<p class="cap">Seu mês</p>':''}<div class="bar">${bar}</div>${ref}<ul class="lg">${lg}</ul></section>
  <section class="pn"><h2>Pontos de decisão</h2><ul class="ins">${I}</ul></section>
  <section class="pn"><label class="f">${C.cx} hoje (R$)<input id="cx" inputmode="decimal" placeholder="0,00" value="${cx?(cx/100).toFixed(2).replace('.',','):''}"></label></section>
  <section class="pn"><h2>Maiores saídas do mês</h2>${cats}</section>
  <section class="pn"><h2>Últimos 6 meses</h2>${hist(m)}</section>`;
}

function lanc(){
  const m=S.m,C=CFG[m];
  const opts=Object.keys(C.g).map(g=>`<optgroup label="${C.g[g]}">${C.c.filter(c=>c[2]===g).map(c=>`<option value="${c[0]}">${c[1]}</option>`).join('')}</optgroup>`).join('');
  const L=S[m].l.filter(l=>l.d.startsWith(S.mes)).sort((x,y)=>y.d.localeCompare(x.d));
  const dflt=S.mes===ym(new Date())?today():S.mes+'-01';
  const rows=L.length?`<ul class="ls">${L.map(l=>{const g=cat(m,l.c)[2];return`<li><div><b>${E(l.desc)}</b><small>${E(cat(m,l.c)[1])} · ${l.d.slice(8)}/${l.d.slice(5,7)}</small></div><span class="v ${isIn(g)?'pos':''}">${isIn(g)?'+':'−'}${brl(l.v)}</span><button class="gh" data-a="del" data-id="${l.id}" aria-label="Excluir ${E(l.desc)}">Excluir</button></li>`}).join('')}</ul>`:'<p class="cap">Nenhum lançamento em '+ml(S.mes)+'. Use o formulário acima para adicionar o primeiro.</p>';
  return mon()+`
  <form class="pn g" id="fm">
    <label class="f full">Descrição<input name="desc" required maxlength="80" placeholder="${m==='pf'?'Ex.: Mercado da semana':'Ex.: Venda para cliente'}"></label>
    <label class="f">Valor (R$)<input name="v" required inputmode="decimal" placeholder="1.250,00"></label>
    <label class="f">Data<input name="d" type="date" required value="${dflt}"></label>
    <label class="f full">Categoria<select name="c">${opts}</select></label>
    <p class="neg full" id="er" role="alert" hidden>Digite um valor maior que zero, por exemplo 1.250,00.</p>
    <button class="pri full" type="submit">Adicionar lançamento</button>
  </form>
  <section class="pn"><h2>Lançamentos de ${ml(S.mes)}</h2>${rows}</section>`;
}

function demo(){
  const m=S.m,P={
    pf:[['sal',6800,5],['ext',600,20],['mor',1800,10],['mer',1250,12],['mer',480,22],['tra',520,15],['sau',260,18],['con',390,8],['laz',540,25],['res',720,19],['cpr',610,14],['ass',130,6],['inv',600,6]],
    pj:[['ven',41000,28],['ser',9500,15],['imp',4500,20],['cmv',17000,5],['fre',2100,8],['fol',10200,5],['alu',3200,10],['mkt',3100,12],['sis',650,6],['ter',900,10],['pro',7000,28]]
  }[m];
  [-2,-1,0].forEach(i=>P.forEach((x,k)=>{
    const f=['sal','ven','ser','alu','fol'].includes(x[0])?1:1+(((k+i*3)%5+5)%5-2)*.04;
    S[m].l.push({id:uid(),c:x[0],desc:cat(m,x[0])[1],v:Math.round(x[1]*f)*100,d:sh(S.mes,i)+'-'+p2(x[2])});
  }));
  if(!S[m].cx)S[m].cx=m==='pf'?1850000:3200000;
}

function render(){
  document.documentElement.dataset.mod=S.m;
  document.querySelectorAll('[data-m]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===S.m));
  document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.v));
  $('#app').innerHTML=S.v==='p'?painel():lanc();
  $('[data-a=clr]').textContent='Apagar dados de '+CFG[S.m].nome;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-m],[data-v],[data-a]');if(!b)return;
  const D=b.dataset,a=D.a;
  if(D.m)S.m=D.m;
  else if(D.v)S.v=D.v;
  else if(a==='pm')S.mes=sh(S.mes,-1);
  else if(a==='nm')S.mes=sh(S.mes,1);
  else if(a==='go')S.v='l';
  else if(a==='demo')demo();
  else if(a==='del')S[S.m].l=S[S.m].l.filter(l=>l.id!==D.id);
  else if(a==='clr'){if(!confirm('Apagar todos os dados de '+CFG[S.m].nome+'? Esta ação não pode ser desfeita.'))return;S[S.m]={l:[],cx:0}}
  save();render();
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target,v=val(f.v.value);
  if(v<=0){$('#er').hidden=false;return}
  S[S.m].l.push({id:uid(),desc:f.desc.value.trim(),v,c:f.c.value,d:f.d.value});
  S.mes=f.d.value.slice(0,7);save();render();
});
document.addEventListener('change',e=>{
  if(e.target.id==='cx'){S[S.m].cx=val(e.target.value);save();render()}
});
render();
</script>
</body>
</html>
